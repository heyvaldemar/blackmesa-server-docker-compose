# Image pin lives HERE, as an interpolation default, so `git pull` (or
# re-downloading this file) delivers the exact image this repository has
# tested. Set BLACKMESA_SERVER_IMAGE_VERSION in .env to run a different tag
# while the digest for it is fetched normally, or BLACKMESA_SERVER_IMAGE_TAG
# to replace the whole reference. CI (the Trivy scan and check-pin-freshness)
# reads the pin from this line: this block is the single source of truth.
#
# The tag is `latest` on purpose. Laclede's LAN rebuilds this image with the
# current game baked in and publishes no version numbers, so the digest IS the
# version: a game update arrives as a new digest under the same tag, the daily
# freshness job goes red, and the pin moves deliberately.
x-images:
  blackmesa-server: &blackmesa-server-image ${BLACKMESA_SERVER_IMAGE_TAG:-lacledeslan/gamesvr-blackmesa:${BLACKMESA_SERVER_IMAGE_VERSION:-latest@sha256:fe7ca6321933af903fd0707b9472b5bcac1c795e35697e826f753704e0691456}}

services:
  blackmesa-server:
    image: *blackmesa-server-image
    # Handles untrusted input from the internet and cannot gain privileges
    # through a setuid binary.
    security_opt:
      - no-new-privileges:true
    # 3g is measured, not guessed: a deathmatch server peaked at 865 MB on the
    # machine this template comes from. The ceiling is there so a leak here
    # cannot pick a victim elsewhere — with no limit the kernel's OOM killer
    # chooses by size, so the process it kills is rarely the one at fault.
    deploy:
      resources:
        limits:
          memory: ${BLACKMESA_SERVER_MEMORY_LIMIT:-3g}
          cpus: "${BLACKMESA_SERVER_CPU_LIMIT:-2.0}"
        reservations:
          memory: ${BLACKMESA_SERVER_MEMORY_RESERVATION:-512m}
          cpus: "${BLACKMESA_SERVER_CPU_RESERVATION:-0.5}"
    ports:
      # THE NUMBER MUST MATCH INSIDE AND OUT. Steam's server list records the
      # port the server binds, not the one you forwarded. Publish 27016 for a
      # server bound on 27015 and the list hands players an address where a
      # different server answers: the connection succeeds, the handshake fails
      # against the wrong game, and every log line blames the client.
      - "${BLACKMESA_SERVER_PORT:-27015}:${BLACKMESA_SERVER_PORT:-27015}/udp"
      # rcon is TCP on the same number.
      - "${BLACKMESA_SERVER_PORT:-27015}:${BLACKMESA_SERVER_PORT:-27015}/tcp"
    working_dir: /app
    # 32-bit srcds: this build of Black Mesa ships no 64-bit server binary.
    # `--net=host` hangs srcds at "Initializing Steam libraries" on a host with
    # more than one interface, with no error; the container's own bridge
    # namespace is why this starts.
    environment:
      # tini (init: true) signals the whole process group.
      TINI_KILL_PROCESS_GROUP: "1"
      # THE GAME GETS THE HOUSEHOLD CLOCK TOO, not only whatever sidecar
      # sits beside it. Every timestamp this server writes — bans, joins,
      # the crash it leaves behind — is read next to a log line from
      # somewhere else, and two clocks make that arithmetic. UTC by
      # default, which is a choice rather than an accident.
      TZ: ${BLACKMESA_SERVER_TIMEZONE:-UTC}
      # Read by the entrypoint below into cfg/secrets/rcon.cfg, never put on a command line.
      BLACKMESA_SERVER_RCON_PASSWORD: ${BLACKMESA_SERVER_RCON_PASSWORD:?set in .env - see .env.example for generation command}
    # THE RCON PASSWORD GOES IN A FILE, NOT ON THE COMMAND LINE. As
    # +rcon_password it sat in srcds's arguments for as long as the server ran,
    # and every user on the host reads a process's arguments with ps. This
    # writes it with the shell's own printf into cfg/secrets/rcon.cfg, on a
    # tmpfs so it never touches a disk, then runs the command below, which
    # carries +exec secrets/rcon.cfg instead. A value with a double quote,
    # which a Source config line cannot carry, stops the start.
    # tests/e2e-rcon-secret.sh runs exactly this against a stand-in srcds_run.
    # A STOP REACHES THE GAME. The entrypoint below ends in exec ./srcds_run,
    # a bash script, which made it process 1, and process 1 with no handler
    # for SIGTERM ignores it: every stop and restart waited out the grace
    # period and ended in Docker's SIGKILL (30 s of 30, exit 137, CI run
    # 43617761533). Docker's init (tini) is process 1 now, and with
    # TINI_KILL_PROCESS_GROUP below it hands SIGTERM to srcds_run and srcds
    # together.
    init: true
    entrypoint:
      - /bin/sh
      - -c
      - |
        case "$$BLACKMESA_SERVER_RCON_PASSWORD" in
          "") echo "BLACKMESA_SERVER_RCON_PASSWORD is not set" >&2; exit 1 ;;
          *\"*) echo "BLACKMESA_SERVER_RCON_PASSWORD holds a double quote, which a Source config line cannot carry" >&2; exit 1 ;;
        esac
        ( umask 077 && printf "rcon_password \"%s\"\n" "$$BLACKMESA_SERVER_RCON_PASSWORD" > bms/cfg/secrets/rcon.cfg ) || exit 1
        exec "$$@"
      - start-server
    tmpfs:
      - /app/bms/cfg/secrets:mode=1777,size=64k
    command:
      - ./srcds_run
      - -game
      - bms
      - -console
      - -usercon
      - -port
      - "${BLACKMESA_SERVER_PORT:-27015}"
      - +maxplayers
      - "${BLACKMESA_SERVER_MAX_PLAYERS:-16}"
      - +map
      - "${BLACKMESA_SERVER_START_MAP:-dm_crossfire}"
      # The RCON password, from the file the entrypoint above writes.
      - +exec
      - secrets/rcon.cfg
      - +mapcyclefile
      - mapcycle.txt
      # 0 and 0 = the map never changes on its own. With the single-entry
      # rotation shipped here, drifting off the map this server exists for is
      # impossible rather than unlikely. Set both in .env for a rotating server.
      - +mp_timelimit
      - "${BLACKMESA_SERVER_TIME_LIMIT:-0}"
      - +mp_fraglimit
      - "${BLACKMESA_SERVER_FRAG_LIMIT:-0}"
    volumes:
      # The health check: A2S_INFO to the game port (see healthcheck: below).
      - ./tools/healthcheck.sh:/healthcheck.sh:ro
      - ./server.cfg:/app/bms/cfg/server.cfg:ro
      # MOUNTED AT BOTH PATHS srcds may read a map cycle from. The engine looks
      # in the game directory and in cfg/, depending on the build; one copy in
      # the wrong place is a rotation that silently does not exist.
      - ./mapcycle.txt:/app/bms/mapcycle.txt:ro
      - ./mapcycle.txt:/app/bms/cfg/mapcycle.txt:ro
    healthcheck:
      # THE GAME'S OWN ANSWER, NOT ITS PROCESS. tools/healthcheck.sh sends
      # A2S_INFO, the query every server browser sends, to the game port and is
      # healthy only on the engine's reply. Up to v1.2.2 this looked for
      # srcds_linux in /proc, and on Docker Engine 29.4.2 this server ran with
      # no socket at all and stayed healthy (run 42503040679): its 32-bit srcds
      # makes sockets through socketcall(2), which that release's seccomp
      # profile refuses. A hung or stopped game keeps its process too. The log
      # is not read either. A map change silences it for seconds; the check
      # tries twice and Docker allows three misses at this interval. Each check
      # ends within 7 seconds.
      # It asks from inside the container: it does not prove the port is
      # published on the host or open in a firewall.
      # CI runs it in the pinned image against a stand-in, and on the real
      # server under 29.4.2's profile and with the game stopped it must go red.
      test: ["CMD", "bash", "/healthcheck.sh", "${BLACKMESA_SERVER_PORT:-27015}"]
      interval: 60s
      timeout: 10s
      retries: 3
      # The game is baked into the image, and it is a large one: four minutes
      # covers the first map load on a slow disk.
      start_period: ${BLACKMESA_SERVER_START_PERIOD:-4m}
    # The stop takes a second or two with init above (tests/clean-stop.sh);
    # the grace period is the ceiling, not the wait.
    stop_grace_period: ${BLACKMESA_SERVER_STOP_GRACE_PERIOD:-30s}
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: ${BLACKMESA_SERVER_LOG_MAX_SIZE:-10m}
        max-file: "${BLACKMESA_SERVER_LOG_MAX_FILE:-3}"
