name: Deployment Verification

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main
  schedule:
    # Daily rebuild: security patches should not wait for a weekly slot.
    - cron: "0 6 * * *"
  workflow_dispatch:

concurrency:
  group: deployment-verification-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

env:
  # Authenticated requests avoid the anonymous API rate limit that shared
  # GitHub runners regularly hit (api.github.com answers 403 otherwise).
  GH_API_TOKEN: ${{ github.token }}

jobs:
  lint:
    name: Lint workflow YAML
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: actionlint (GitHub Actions workflow linting)
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt \
            rhysd/actionlint:1.7.12 \
            -color

  scan-trivy:
    name: Scan pinned upstream image with Trivy
    runs-on: ubuntu-latest
    # Fifteen, not ten: this image bakes the game in, and walking a few
    # gigabytes of it takes longer than a scan of a service image.
    timeout-minutes: 15
    permissions:
      contents: read
      security-events: write
    strategy:
      # Image refs are read from the compose file's x-images defaults at
      # runtime — single source of truth.
      fail-fast: false
      matrix:
        include:
          - name: blackmesa-server
            env_var: BLACKMESA_SERVER_IMAGE_TAG

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Read pinned ${{ matrix.name }} image from the compose file
        id: pin
        env:
          ENV_VAR: ${{ matrix.env_var }}
        run: |
          image="$(grep -m1 -oE "\\\$\\{${ENV_VAR}:-.*" blackmesa-server-docker-compose.yml | sed -E -e ':a' -e 's/\$\{[A-Z0-9_]+:-([^{}]*)\}/\1/' -e 'ta')"
          if [ -z "$image" ]; then
            echo "${ENV_VAR} default not found in the compose x-images block" >&2
            exit 1
          fi
          echo "image=$image" >> "$GITHUB_OUTPUT"

      - name: Trivy scan of ${{ matrix.name }}
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ steps.pin.outputs.image }}
          format: sarif
          output: trivy-${{ matrix.name }}.sarif
          severity: CRITICAL,HIGH
          ignore-unfixed: true
          # FINDINGS DO NOT FAIL THIS STEP; A BROKEN SCAN DOES. That is what
          # exit-code 0 buys, and it is written here rather than left to the
          # action's default because the job no longer carries
          # continue-on-error and the difference now decides whether a red run
          # means "a new CVE upstream" or "the scanner could not finish".
          exit-code: "0"
          # Vulnerabilities only. The secret scanner walks every file in the
          # image, and this one contains the game: bms_maps_021.vpk alone is
          # 257 MB. On 2026-09-14 it ran into Trivy's own deadline and the scan
          # died with "semaphore acquire: context deadline exceeded", which
          # skipped the SARIF upload, so nothing reached the Security tab
          # either. Secret-scanning an upstream image nobody here builds was
          # never the point; the CVEs in its packages are.
          scanners: vuln
          timeout: 12m

      - name: Upload Trivy SARIF (${{ matrix.name }}) to GitHub Security
        uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: trivy-${{ matrix.name }}.sarif
          category: trivy-${{ matrix.name }}

  healthcheck:
    name: The health check, in both directions
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # Pinned, and the same image a maintainer runs locally: Ubuntu's
        # packaged shellcheck is a different version with different defaults.
        run: |
          docker run --rm -v "$PWD:/mnt" -w /mnt koalaman/shellcheck:v0.11.0 tools/*.sh tests/e2e-healthcheck.sh tests/e2e-rcon-secret.sh

      - name: The compose file parses with the shipped defaults
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          docker compose -f blackmesa-server-docker-compose.yml config >/dev/null
          echo "compose OK"

      - name: The RCON password is on no command line
        # It was +rcon_password on srcds's command line for as long as the
        # server ran, readable by every user on the host. The game image is
        # too large for a runner, so the compose file's own entrypoint, command
        # and tmpfs run against a stand-in srcds_run, and every command line on
        # the runner and in the container is read for the password.
        run: |
          chmod +x tests/e2e-rcon-secret.sh
          ./tests/e2e-rcon-secret.sh

  boot:
    name: The real server, and rcon against it
    # THE README'S COMMAND IS RUN, NOT ONLY WRITTEN. Up to v1.2 it named an
    # rcon program the image does not carry, and nothing here ever ran it.
    # This boots the pinned image from this compose file with a random RCON
    # password and runs tools/rcon.sh, the command the README now gives: the
    # hostname line must come back, and a wrong password must be refused.
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: read
    env:
      COMPOSE: docker compose -f blackmesa-server-docker-compose.yml -p blackmesa
    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Make room for the image
        # 17.75 GB compressed; a runner starts with less free than its
        # unpacked size on the root disk.
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h / | tail -1

      - name: Docker 29.4.2 answers socketcall with ENOSYS; give its daemon the profile 29.4.3 ships
        # Docker Engine 29.4.2, and that release alone, blocks the 32-bit
        # socketcall(2) system call in its default seccomp profile
        # (moby/moby#52506; the ubuntu-26.04 runner image ships it,
        # actions/runner-images#14790). Black Mesa's srcds, a 32-bit program,
        # makes every socket through it, so on 29.4.2 it stays up and healthy
        # and opens no socket at all: no A2S answer, no rcon. 29.4.3 reverted
        # the rule. On that version, and only there, the daemon gets the default
        # profile 29.4.3 ships (moby/profiles seccomp v0.2.3), pinned by commit
        # and checksum. Measured: blackmesa-server-docker-compose run
        # 42503040679.
        run: |
          v="$(docker version --format '{{.Server.Version}}')"
          if [ "$v" != 29.4.2 ]; then echo "Docker $v: its own profile allows socketcall"; exit 0; fi
          sudo curl -fsSL -o /etc/docker/seccomp-29.4.3.json \
            https://raw.githubusercontent.com/moby/profiles/836ae4d37ef2ec995c77c99fc55f5b5f3af3a897/seccomp/default.json
          echo "536529b665dd0972c37bfb569f5d4ac8a53592e7b00752bc39ff063ca9864c74  /etc/docker/seccomp-29.4.3.json" | sha256sum -c -
          f=/etc/docker/daemon.json
          [ -s "$f" ] || echo '{}' | sudo tee "$f" >/dev/null
          sudo jq '. + {"seccomp-profile": "/etc/docker/seccomp-29.4.3.json"}' "$f" | sudo tee "$f.new" >/dev/null
          sudo mv "$f.new" "$f"
          sudo systemctl restart docker
          docker info --format '{{.SecurityOptions}}'

      - name: Start the stack with a random RCON password
        run: |
          sed -E 's/^([A-Z0-9_]+)=$/\1=ci-placeholder/' .env.example > .env
          sed -i "s/^BLACKMESA_SERVER_RCON_PASSWORD=.*/BLACKMESA_SERVER_RCON_PASSWORD=$(openssl rand -hex 16)/" .env
          $COMPOSE up -d

      - name: Wait for the health check to go green
        run: |
          cid="$($COMPOSE ps -q blackmesa-server)"
          for _ in $(seq 1 60); do
            s="$(docker inspect "$cid" --format '{{.State.Health.Status}}' 2>/dev/null || echo none)"
            [ "$s" = healthy ] && { echo "health: $s"; exit 0; }
            [ "$s" = unhealthy ] && break
            sleep 10
          done
          echo "::error::the server never reported healthy"
          $COMPOSE logs --tail 80
          echo "--- the health check's own words, last runs"
          docker inspect "$cid" --format '{{range .State.Health.Log}}exit {{.ExitCode}}: {{.Output}}{{end}}' | tail -c 2000
          echo "--- UDP sockets in the container"
          docker exec "$cid" cat /proc/net/udp
          exit 1

      - name: The health check goes by the game's answer, in the pinned image
        # tools/healthcheck.sh is healthy only on the engine's reply to
        # A2S_INFO. Run in the pinned image (here, where the image is already
        # pulled), so its tools are proven there, against a stand-in that
        # answers, answers after a challenge, stays silent, or is not there at
        # all (tests/fixtures/fake-a2s.py).
        run: |
          chmod +x tests/e2e-healthcheck.sh
          ./tests/e2e-healthcheck.sh

      - name: The old README command could not work
        run: |
          if $COMPOSE exec -T blackmesa-server sh -c 'command -v rcon'; then
            echo "::error::the image now carries an rcon program; the README could name it again"; exit 1
          fi
          echo "no rcon program in the image, as the README now says"

      - name: tools/rcon.sh answers, and refuses a wrong password
        run: |
          # Healthy means the engine answered A2S_INFO; a refused rcon
          # connection (exit 1) is still retried, as it was when healthy
          # meant only the process.
          for _ in $(seq 1 30); do
            rc=0; out="$(tools/rcon.sh status 2>&1)" || rc=$?
            [ "$rc" = 1 ] || break
            sleep 10
          done
          printf '%s\n' "$out" | head -5
          grep -q '^hostname' <<<"$out" || { echo "::error::status did not return the hostname line (exit $rc)"; exit 1; }
          cp .env .env.good
          sed -i 's/^BLACKMESA_SERVER_RCON_PASSWORD=.*/BLACKMESA_SERVER_RCON_PASSWORD=not-the-password/' .env
          rc=0; tools/rcon.sh status || rc=$?
          mv .env.good .env
          [ "$rc" = 2 ] || { echo "::error::a wrong password was not refused (exit $rc)"; exit 1; }
          echo "a wrong password: refused, exit 2"

      - name: The health check answers again after a map change
        # A changelevel silences A2S_INFO while the next map loads. The check
        # must answer again within two minutes, on the new map, and Docker's
        # status (three misses at a 60-second interval) must stay healthy.
        run: |
          cid="$($COMPOSE ps -q blackmesa-server)"
          docker exec "$cid" bash /healthcheck.sh 27015
          tools/rcon.sh changelevel dm_bounce >/dev/null
          t0=$SECONDS; misses=0; ok=""
          while [ $((SECONDS - t0)) -lt 120 ]; do
            if docker exec "$cid" bash /healthcheck.sh 27015 >/dev/null 2>&1; then
              [ $((SECONDS - t0)) -ge 15 ] && { ok=1; break; }
            else
              misses=$((misses + 1))
            fi
            sleep 2
          done
          map="$(tools/rcon.sh status | sed -n 's/^map *: *\([^ ]*\).*/\1/p')"
          s="$(docker inspect "$cid" --format '{{.State.Health.Status}}')"
          echo "after changelevel: map ${map:-?}, $misses missed checks, answering at $((SECONDS - t0))s, docker health: $s"
          [ "$ok" = 1 ] || { echo "::error::the game did not answer again within two minutes of the map change"; exit 1; }
          [ "$map" = dm_bounce ] || { echo "::error::the map did not change, so this proved nothing"; exit 1; }
          [ "$s" = healthy ] || { echo "::error::docker called it $s across a map change"; exit 1; }

      - name: Plant - a stopped game keeps its process, and the check goes red
        # The check up to v1.2.2 looked for srcds_linux in /proc. SIGSTOP
        # leaves the process there and the game deaf: that check must still
        # pass and this one fail; after SIGCONT this one passes again.
        run: |
          cid="$($COMPOSE ps -q blackmesa-server)"
          # shellcheck disable=SC2016  # expanded by the container's shell
          pid="$(docker exec "$cid" sh -c 'for p in /proc/[0-9]*; do [ "$(cat "$p/comm" 2>/dev/null)" = srcds_linux ] && echo "${p#/proc/}"; done' | head -1)"
          [ -n "$pid" ] || { echo "::error::no srcds_linux process to stop"; exit 1; }
          docker exec "$cid" sh -c "kill -STOP $pid"
          o=0; docker exec "$cid" sh -c "grep -qsx srcds_linux /proc/[0-9]*/comm" || o=$?
          n=0; docker exec "$cid" bash /healthcheck.sh 27015 || n=$?
          docker exec "$cid" sh -c "kill -CONT $pid"
          echo "game stopped: the old check exits $o, the new one $n"
          [ "$o" = 0 ] && [ "$n" = 1 ] || { echo "::error::expected the old check to pass (0) and the new one to fail (1)"; exit 1; }
          for _ in $(seq 1 15); do
            docker exec "$cid" bash /healthcheck.sh 27015 && exit 0
            sleep 2
          done
          echo "::error::the game did not answer again after SIGCONT"; exit 1

      - name: Plant - Docker 29.4.2's seccomp profile, the server it left healthy with no socket
        # The false green this check exists for, reproduced on any Docker: the
        # container gets the default profile Docker 29.4.2 shipped (moby/profiles
        # seccomp v0.2.2, pinned by commit and checksum), whose rule answers
        # 32-bit socketcall(2) with ENOSYS. srcds then runs with no socket. The
        # old /proc check must pass and this one fail, saying nothing is bound;
        # recreated without it, the server must answer again.
        run: |
          curl -fsSL -o .ci-seccomp-0.2.2.json \
            https://raw.githubusercontent.com/moby/profiles/d62da2729e94ffb023ed7c5e215f65a726fafd82/seccomp/default.json
          echo "1a4d017730647621403920d9558aa0152adef04dd89ed7720e4abafa24551999  .ci-seccomp-0.2.2.json" | sha256sum -c -
          jq -e '.syscalls[] | select(.names == ["socketcall"] and .action == "SCMP_ACT_ERRNO" and .errnoRet == 38)' .ci-seccomp-0.2.2.json >/dev/null
          printf '%s\n' 'services:' '  blackmesa-server:' '    security_opt:' "      - seccomp=$PWD/.ci-seccomp-0.2.2.json" > .ci-seccomp.yml
          $COMPOSE -f .ci-seccomp.yml up -d --force-recreate blackmesa-server
          cid="$($COMPOSE ps -q blackmesa-server)"
          # srcds_run restarts a srcds that dies, so the process can be gone for
          # a moment; poll for four minutes. Required: at least one moment, a
          # minute in, with the process there and this check red for want of a
          # socket; and this check never green under this profile.
          seen=""; green=0; samples=0
          for _ in $(seq 1 24); do
            sleep 10
            o=0; docker exec "$cid" sh -c "grep -qsx srcds_linux /proc/[0-9]*/comm" || o=$?
            n=0; out="$(docker exec "$cid" bash /healthcheck.sh 27015 2>&1)" || n=$?
            samples=$((samples + 1))
            [ "$n" = 0 ] && green=$((green + 1))
            if [ "$SECONDS" -ge 60 ] && [ "$o" = 0 ] && [ "$n" = 1 ] && [[ $out == *"nothing is bound"* ]]; then
              seen="$out"
            fi
          done
          st="$(docker inspect "$cid" --format '{{.State.Status}} restarts={{.RestartCount}}')"
          echo "under 29.4.2's profile ($st), $samples samples: this check green $green times; process there and this check red: ${seen:-never}"
          rm -f .ci-seccomp.yml .ci-seccomp-0.2.2.json
          [ "$green" = 0 ] && [ -n "$seen" ] || { echo "::error::expected a live process with this check red (nothing is bound), and never green"; exit 1; }
          $COMPOSE up -d --force-recreate blackmesa-server
          cid="$($COMPOSE ps -q blackmesa-server)"
          for _ in $(seq 1 30); do
            docker exec "$cid" bash /healthcheck.sh 27015 2>/dev/null && exit 0
            sleep 10
          done
          echo "::error::recreated with the daemon's profile, the server did not answer again"; exit 1

      - name: Stop
        if: always()
        run: $COMPOSE down -v --remove-orphans
