// The name players see in the browser and on the scoreboard.
hostname "Black Mesa Crossfire 24/7"

// Free-for-all. The image's own cfg ships mp_teamplay 1, which flipped a
// running server into team mode mid-session; this copy pins it to 0.
mp_teamplay 0
mp_forcerespawn 1

// Game log settings. sv_logflush 1 is the one that matters: the engine BUFFERS
// the log and flushes only when the file is closed, so a quiet server writes a
// file that reports zero bytes for as long as the buffer takes to fill. Two
// players chatted for ten minutes while `ls` showed 0; every word was in the
// buffer and reached disk at the next map change. The log was never broken. It
// was invisible.
//
// server.cfg is also exec'd at EVERY map load, and a second `log on` while
// logging is already on closes the current file and opens a fresh one — which
// is how a server ends up with 141 log files in one day. sv_log_onefile 1 keeps
// one file across map changes.
sv_logflush 1
sv_log_onefile 1
sv_logecho 1
log on
